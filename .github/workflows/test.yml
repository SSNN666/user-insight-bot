name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v --tb=short 2>&1 | tee /tmp/pytest_out.txt
      - name: Upload failure details (debug)
        if: failure()
        run: |
          {
            echo '### pytest 失败详情'
            echo '```'
            tail -120 /tmp/pytest_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify imports
        run: |
          uv run python -c "
          from tools import tools; print(f'{len(tools)} tools OK')
          from agent.agent import _build_graph; print('agent OK')
          from flywheel.retriever import retrieve_relevant_samples; print('retriever OK')
          from config.settings import get_settings; print(f'config OK (v{get_settings().APP_VERSION})')
          "

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Run tests
        run: npm test
