[project]
name = "user-insight-bot"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "gradio>=6.0",
    "jieba>=0.42.1",
    "langchain>=1.3.4",
    "langchain-openai>=0.3",
    "matplotlib>=3.11.1",
    "milvus-lite>=3.1.0",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "python-json-logger>=4.1.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
